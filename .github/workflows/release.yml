name: Build release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[draft,voice,visual,dev]'
      - run: python -m build
      - run: python scripts/build_release.py
      - name: Test frozen executable
        run: |
          choco install ffmpeg --no-progress -y
          $cli = Get-ChildItem release -Directory | ForEach-Object { Join-Path $_.FullName 'auto-edit.exe' } | Select-Object -First 1
          & $cli --version
          python scripts/smoke_release.py $cli
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*
            release/*.zip
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: python -m pip install '.[draft,voice,visual,dev]'
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python scripts/build_macos.py
      - name: Test unpacked Mac app and CLI
        shell: bash
        run: |
          archive=$(ls release/*-macos-${{ matrix.arch }}.zip)
          ditto -x -k "$archive" work/mac-package-smoke
          base=$(find work/mac-package-smoke -maxdepth 1 -type d -name 'auto-video-editor-*' | head -n 1)
          codesign --verify --deep --strict "$base/AutoVideoEditor.app"
          python scripts/smoke_release.py "$base/auto-edit" --app "$base/AutoVideoEditor.app"
          hdiutil verify release/*-macos-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: packages-macos-${{ matrix.arch }}
          path: |
            release/*.zip
            release/*.dmg
            release/SHA256SUMS-*.txt
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Auto Video Editor $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          fi
          mapfile -d '' editor_packages < <(find packages -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.whl' -o -name '*.tar.gz' -o -name 'SHA256SUMS-*.txt' \) -print0)
          sha256sum "${editor_packages[@]}" | sed 's|  packages/[^/]*/|  |' > SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" "${editor_packages[@]}" SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
